<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos Invitations</title>
    <style>
        :root { --gold: #d4b499; --white: #ffffff; --nav-h: 70px; }
        html { scroll-behavior: smooth; }
        body, html { margin: 0; padding: 0; background: var(--white); font-family: 'Optima', 'Georgia', serif; }

        /* NAVBAR RESPONSIVE */
        nav {
            background: var(--white);
            position: fixed;
            top: 0;
            width: 100%;
            height: auto;
            min-height: var(--nav-h);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom: 1px solid #f0f0f0;
            padding: 10px 0;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        nav ul li a {
            text-decoration: none;
            color: var(--gold);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* SECTIONS SANS ESPACE */
        section {
            width: 100%;
            line-height: 0;
            display: flex;
            justify-content: center;
            background: #fff;
        }
        #mairie { padding-top: 80px; } /* Ajustement pour la navbar */

        .img-full {
            width: 100%;
            max-width: 900px;
            height: auto;
            display: block;
        }

        /* RSVP RESPONSIVE */
        #rsvp {
            line-height: normal;
            padding: 60px 15px;
            background: #fafafa;
            display: flex;
            justify-content: center;
        }
        .rsvp-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .events-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #fdfdfd;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .btn {
            background: var(--gold);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* AJUSTEMENTS MOBILE */
        @media (max-width: 480px) {
            nav ul { gap: 8px; }
            nav ul li a { font-size: 0.65rem; letter-spacing: 0.5px; }
            .events-grid { grid-template-columns: 1fr; }
            #mairie { padding-top: 100px; }
        }
    </style>
</head>
<body>

<nav>
    <ul>
        <li><a href="#mairie">MAIRIE</a></li>
        <li><a href="#henne">HENNÉ</a></li>
        <li><a href="#houppa">HOUPPA</a></li>
        <li><a href="#chabbat">CHABBAT HATAN</a></li>
        <li><a href="#infos">INFOS</a></li>
        <li><a href="#rsvp">RSVP</a></li>
    </ul>
</nav>

<section id="mairie"><img src="mairie1.png" class="img-full" alt="Mairie"></section>
<section id="henne"><img src="henne1.png" class="img-full" alt="Henné"></section>
<section id="houppa"><img src="houppa1.png" class="img-full" alt="Houppa"></section>
<section id="chabbat"><img src="chabhat1.png" class="img-full" alt="Chabbat"></section>
<section id="infos"><img src="info1.04.33.png" class="img-full" alt="Infos"></section>

<section id="rsvp">
    <div class="rsvp-card">
        <h2 style="text-align:center; color:var(--gold); letter-spacing:3px; font-weight:300; text-transform:uppercase; margin-bottom: 25px;">RSVP</h2>

        <form action="mailto:eliechicha1@icloud.com" method="post" enctype="text/plain">
            <div class="form-group">
                <label style="font-size: 0.8rem; letter-spacing: 1px;">NOM DE FAMILLE</label>
                <input type="text" name="Nom_Famille" placeholder="Ex: Famille Levy" required>
            </div>

            <style>
                /* BASE & CONTAINERS */
                .event-container {
                    margin-bottom: 12px;
                    border: 1px solid #f0f0f0;
                    border-radius: 12px;
                    padding: 12px;
                    background: #fff;
                    transition: border-color 0.3s ease;
                }

                .event-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    gap: 10px;
                }

                .event-name {
                    font-weight: bold;
                    color: var(--gold);
                    text-transform: uppercase;
                    font-size: 0.75rem;
                    letter-spacing: 1px;
                    flex-shrink: 0; /* Empêche le nom d'être écrasé */
                }

                /* BOUTONS RADIO TYPE TABS */
                .radio-group {
                    display: flex;
                    background: #f8f8f8;
                    border-radius: 8px;
                    padding: 2px;
                    border: 1px solid #eee;
                    min-width: 150px; /* Assure une taille stable sur mobile */
                }

                .radio-group label {
                    margin: 0;
                    padding: 8px 10px;
                    border-radius: 6px;
                    cursor: pointer;
                    font-size: 0.65rem;
                    transition: 0.3s;
                    flex: 1;
                    text-align: center;
                    font-weight: 700;
                    color: #999;
                    white-space: nowrap;
                }

                .radio-group input { display: none; }
                .radio-group label:has(input:checked) { background: var(--gold); color: white; }

                /* QUANTITÉ DYNAMIQUE */
                .qty-selection {
                    max-height: 0;
                    overflow: hidden;
                    transition: all 0.4s ease;
                    opacity: 0;
                }

                .event-container:has(input[value="Présent"]:checked) { border-color: var(--gold); background: #fffefa; }
                .event-container:has(input[value="Présent"]:checked) .qty-selection {
                    max-height: 80px;
                    opacity: 1;
                    margin-top: 12px;
                    padding-top: 12px;
                    border-top: 1px dashed #eee;
                }

                .qty-input {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                }
                .qty-input label { font-size: 0.75rem; color: #666; font-weight: 500; margin: 0; }
                .qty-input input {
                    border: 1px solid #ddd;
                    padding: 6px;
                    border-radius: 6px;
                    width: 50px;
                    text-align: center;
                    font-size: 0.9rem;
                }

                /* --- AJUSTEMENTS RESPONSIVE --- */
                @media (max-width: 400px) {
                    .event-header {
                        flex-direction: column; /* On passe l'un sous l'autre sur les très petits écrans */
                        align-items: flex-start;
                    }
                    .radio-group {
                        width: 100%;
                        margin-top: 8px;
                    }
                    .event-name { font-size: 0.7rem; }
                    .rsvp-card { padding: 15px; }
                }
            </style>

            <div class="event-container">
                <div class="event-header">
                    <span class="event-name">Mairie</span>
                    <div class="radio-group">
                        <label><input type="radio" name="Mairie_Statut" value="Présent"> Présent</label>
                        <label><input type="radio" name="Mairie_Statut" value="Absent" checked> Absent</label>
                    </div>
                </div>
                <div class="qty-selection"><div class="qty-input"><label>Nombre d'adultes</label><input type="number" name="Mairie_Adultes" min="1" value="1"></div></div>
            </div>

            <div class="event-container">
                <div class="event-header">
                    <span class="event-name">Henné</span>
                    <div class="radio-group">
                        <label><input type="radio" name="Henne_Statut" value="Présent"> Présent</label>
                        <label><input type="radio" name="Henne_Statut" value="Absent" checked> Absent</label>
                    </div>
                </div>
                <div class="qty-selection"><div class="qty-input"><label>Nombre d'adultes</label><input type="number" name="Henne_Adultes" min="1" value="1"></div></div>
            </div>

            <div class="event-container">
                <div class="event-header">
                    <span class="event-name">Houppa</span>
                    <div class="radio-group">
                        <label><input type="radio" name="Houppa_Statut" value="Présent"> Présent</label>
                        <label><input type="radio" name="Houppa_Statut" value="Absent" checked> Absent</label>
                    </div>
                </div>
                <div class="qty-selection"><div class="qty-input"><label>Nombre d'adultes</label><input type="number" name="Houppa_Adultes" min="1" value="1"></div></div>
            </div>

            <div class="event-container">
                <div class="event-header">
                    <span class="event-name">Chabbat Hatan</span>
                    <div class="radio-group">
                        <label><input type="radio" name="Chabbat_Statut" value="Présent"> Présent</label>
                        <label><input type="radio" name="Chabbat_Statut" value="Absent" checked> Absent</label>
                    </div>
                </div>
                <div class="qty-selection"><div class="qty-input"><label>Nombre d'adultes</label><input type="number" name="Chabbat_Adultes" min="1" value="1"></div></div>
            </div>

            <button type="submit" class="btn" style="margin-top: 20px;">Envoyer ma réponse</button>
        </form>
    </div>
</section>

</body>
</html>
